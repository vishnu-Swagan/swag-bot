[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swag-bot"
version = "0.1.0"
description = "Free, open-source AI agent that completes complex multi-step tasks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Vishnu M" }]
keywords = ["ai", "agent", "mcp", "plugins", "skills"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.5",
    "tomli-w>=1.0",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]
# Installed by the owning agents when they implement the real backends.
# CI does not install these. `swag doctor` reports whether they are present.
models = ["litellm"]
mcp = ["mcp"]
sandbox = ["docker"]

[project.scripts]
swag = "swag_bot.cli:main"

[project.urls]
Homepage = "https://github.com/vishnu-Swagan/swag-bot"
Repository = "https://github.com/vishnu-Swagan/swag-bot"

[tool.hatch.build.targets.wheel]
only-include = ["src/swag_bot"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["swag_bot", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-q", "--strict-markers"]

[tool.mypy]
python_version = "3.11"
packages = ["swag_bot"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
